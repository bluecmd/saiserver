[package]
name = "sai-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Bounded, confirmed SAI management over binary/buffered Thrift"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
thrift = "0.25"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
strip = true
